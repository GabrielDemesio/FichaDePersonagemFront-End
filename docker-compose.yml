version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rpg-ficha-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rpg_db
      MYSQL_USER: rpg_user
      MYSQL_PASSWORD: rpg_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rpg_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rpg-ficha-api
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rpg_db?useSSL=false
      SPRING_DATASOURCE_USERNAME: rpg_user
      SPRING_DATASOURCE_PASSWORD: rpg_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: